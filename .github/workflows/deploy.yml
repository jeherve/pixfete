# This workflow automatically updates the plugin on WordPress.org
name: Deploy to WordPress.org
on:
  release:
    types: [published]

jobs:
  tag:
    name: Deploy new tag to WordPress.org
    runs-on: ubuntu-latest
    # Skip pre-releases — when a pre-release is created, GitHub fires both
    # 'prereleased' and 'published' events. Without this guard, a pre-release
    # would be deployed to WordPress.org.
    if: ${{ !github.event.release.prerelease }}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install npm dependencies
      run: npm ci

    - name: Build assets
      run: npm run build

    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
